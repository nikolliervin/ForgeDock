services:
  web:
    build: ./web
    environment:
      PORT: "8080"
      REDIS_HOST: cache
    depends_on:
      cache:
        condition: service_healthy
  cache:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [cache-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 10
volumes:
  cache-data:
